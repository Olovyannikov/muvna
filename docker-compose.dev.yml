# Только Postgres для локальной разработки: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: muvna
      POSTGRES_PASSWORD: muvna
      POSTGRES_DB: muvna
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
