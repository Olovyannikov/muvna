name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: FSD (steiger)
        run: pnpm --filter @muvna/web lint:fsd
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @muvna/web build
      - name: Build CMS
        run: pnpm --filter @muvna/cms build
        env:
          PAYLOAD_SECRET: ci
          DATABASE_URL: postgres://ci@localhost/ci
