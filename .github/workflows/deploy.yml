name: Deploy

# Сборка образов в GHCR и выкладка на VPS по SSH:
#   main    → прод   (~/muvna,     docker-compose.yml)
#   develop → dev    (~/muvna-dev, deploy/dev.compose.yml)
# Секреты репозитория: VPS_HOST, VPS_USER, VPS_SSH_KEY (и при необходимости VPS_PORT).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency: deploy-${{ github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cms, web]
    steps:
      - uses: actions/checkout@v4
      # Имена образов в GHCR — только в нижнем регистре.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muvna-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.app == 'cms' && 'runner' || '' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      DIR: ${{ github.ref_name == 'main' && 'muvna' || 'muvna-dev' }}
      COMPOSE: ${{ github.ref_name == 'main' && 'docker-compose.yml' || 'deploy/dev.compose.yml' }}
      PROJECT: ${{ github.ref_name == 'main' && 'muvna' || 'muvna-dev' }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''
      - name: Copy compose files and Caddyfile
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,deploy/Caddyfile,deploy/dev.compose.yml
          target: ${{ env.DIR }}
      - name: Pull & restart
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DIR,COMPOSE,PROJECT
          script: |
            set -e
            cd ~/$DIR
            # Версия фиксируется в .env — ручной `docker compose up` не откатит деплой.
            sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
            docker compose -p $PROJECT -f $COMPOSE pull cms web
            docker compose -p $PROJECT -f $COMPOSE up -d --remove-orphans
            docker image prune -f
            docker compose -p $PROJECT -f $COMPOSE ps
      - name: Skip (no VPS secrets)
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST не задан — образы собраны, выкладка пропущена."
