name: Deploy

# Сборка образов в GHCR и выкладка на VPS по SSH.
# Нужны секреты репозитория: VPS_HOST, VPS_USER, VPS_SSH_KEY (и при необходимости VPS_PORT).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cms, web]
    steps:
      - uses: actions/checkout@v4
      # Имена образов в GHCR — только в нижнем регистре.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muvna-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.app == 'cms' && 'runner' || '' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''
      - name: Copy compose file
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: muvna
      - name: Pull & restart
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ~/muvna
            # Версия фиксируется в .env — ручной `docker compose up` не откатит деплой.
            sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
            docker compose pull cms web
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
      - name: Skip (no VPS secrets)
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST не задан — образы собраны, выкладка пропущена."
