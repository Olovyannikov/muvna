name: Vercel (dev)

# Витрина на Vercel поверх dev-CMS на ВМ (админка на Vercel не нужна):
#   push develop  → прод-деплой проекта muvna-dev (https://muvna-dev.vercel.app)
#   pull request  → preview-деплой с отдельным адресом (ссылка в summary джоба)
# Нужен секрет VERCEL_TOKEN (vercel.com/account/tokens); VERCEL_SCOPE — slug команды, если проект не личный.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency: vercel-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD: ${{ github.event_name == 'push' && '1' || '' }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - name: Skip (no VERCEL_TOKEN)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN не задан — деплой на Vercel пропущен."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.VERCEL_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Build (Build Output API)
        if: env.VERCEL_TOKEN != ''
        run: pnpm --filter @muvna/web build:vercel
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        timeout-minutes: 8
        run: node apps/web/scripts/deploy-vercel.mjs
