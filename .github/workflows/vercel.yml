name: Vercel (dev)

# Витрина на Vercel поверх dev-CMS на ВМ (админка на Vercel не нужна):
#   push develop  → прод-деплой проекта muvna-dev (https://muvna-dev.vercel.app)
#   pull request  → preview-деплой с отдельным адресом (ссылка в summary джоба)
# Нужен секрет VERCEL_TOKEN (vercel.com/account/tokens); VERCEL_SCOPE — slug команды, если проект не личный.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency: vercel-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: ${{ secrets.VERCEL_SCOPE && format('--scope {0}', secrets.VERCEL_SCOPE) || '' }}
      PROD: ${{ github.event_name == 'push' && '--prod' || '' }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - name: Skip (no VERCEL_TOKEN)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN не задан — деплой на Vercel пропущен."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.VERCEL_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Build (Build Output API)
        if: env.VERCEL_TOKEN != ''
        run: pnpm --filter @muvna/web build:vercel
      - name: Link project and deploy
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        timeout-minutes: 5
        run: |
          # Франкфурт — ближе всего к CMS в Москве: каждый рендер ходит туда за данными.
          # (regions в .vc-config.json подвешивает сборку на Vercel — задаём на проекте)
          curl -sf -X PATCH "https://api.vercel.com/v9/projects/muvna-dev${VERCEL_SCOPE:+?slug=$VERCEL_SCOPE}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            -d '{"serverlessFunctionRegion":"fra1"}' -o /dev/null \
            && echo "function region: fra1" || echo "::warning::не удалось задать регион функции fra1"
          # зависшая сборка держит очередь (на Hobby сборки идут по одной) — отменяем такие
          node -e '
            const q = new URLSearchParams({ app: "muvna-dev", state: "BUILDING,QUEUED,INITIALIZING", limit: "20" });
            if (process.env.VERCEL_SCOPE) q.set("slug", process.env.VERCEL_SCOPE);
            const h = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
            const sfx = q.has("slug") ? `?slug=${q.get("slug")}` : "";
            const { deployments = [] } = await (await fetch(`https://api.vercel.com/v6/deployments?${q}`, { headers: h })).json();
            for (const d of deployments) {
              const r = await fetch(`https://api.vercel.com/v12/deployments/${d.uid}/cancel${sfx}`, { method: "PATCH", headers: h });
              console.log(`cancel ${d.uid} (${d.state}): ${r.status}`);
            }
          ' --input-type=module || echo "::warning::не удалось проверить зависшие деплои"
          npx --yes vercel@65 link --yes --project muvna-dev --token "$VERCEL_TOKEN" $SCOPE
          URL=$(npx --yes vercel@65 deploy --prebuilt $PROD --token "$VERCEL_TOKEN" $SCOPE)
          echo "### Vercel: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $URL"
